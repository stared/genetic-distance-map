<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Genetic Similarity Map</title>
<meta name="description" content="Map of genetic similarity between present-day and ancient populations, from Global25 population averages (Moriopoulos Collection 2025)." />
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>
<div id="app">
  <aside id="panel">
    <header>
      <h1>Genetic Similarity Map</h1>
      <div id="modes" class="seg">
        <button data-mode="sim" class="active">Similarity</button>
        <button data-mode="clu">Clusters</button>
      </div>
    </header>

    <section id="mode-sim" class="mode">
      <div class="search">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search present-day or historical population" autocomplete="off" spellcheck="false" />
      </div>
      <ul id="suggest" hidden></ul>
      <div id="query" class="query"></div>
      <div id="nearest" class="list"></div>
    </section>

    <section id="mode-clu" class="mode" hidden>
      <div id="clutree" class="tree"></div>
    </section>

    <footer>Data from <a href="https://genarchivist.net/showthread.php?tid=1449" target="_blank">Moriopoulos Collection 2025</a> on <a href="https://eurogenes.blogspot.com/2019/07/getting-most-out-of-global25_12.html" target="_blank">Global25</a><br>Data viz by <a href="https://p.migdal.pl" target="_blank">Piotr Migdał</a>, 2026, <a href="https://github.com/stared/genetic-distance-map" target="_blank">source and notes</a><br>Locations approximate, interpolation decorative</footer>
  </aside>
  <div id="map">
    <div id="legend" hidden>
      <div class="lt">Genetic distance to <b id="lname"></b>, on <select id="range"><option value="0.05">close</option><option value="0.25" selected>regional</option><option value="1">global</option></select> scale</div>
      <div class="lx"><span id="dmin">0</span><div class="ramp" id="ramp"></div><span id="dmaxv">20</span></div>
    </div>
  </div>
  <div id="tooltip" hidden></div>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
