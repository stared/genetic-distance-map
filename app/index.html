<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>G25 map</title>
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>
<div id="app">
  <aside id="panel">
    <header>
      <div id="modes" class="tabs">
        <button data-mode="sim" class="active">Similarity</button>
        <button data-mode="clu">Clusters</button>
        <button data-mode="split">Split</button>
      </div>
      <div id="period" class="period">
        <button data-period="m" class="active">Present-day populations</button>
        <button data-period="a">Ancient samples</button>
      </div>
    </header>

    <section id="mode-sim" class="mode">
      <div class="search">
        <input id="search" type="search" placeholder="Search population" autocomplete="off" spellcheck="false" />
        <ul id="suggest" hidden></ul>
      </div>
      <div id="query" class="query"></div>
      <div class="legend">
        <div class="legend-head"><span>Distance</span><span class="legend-max">0 – <input type="number" id="dmax" min="2" max="80" step="1" value="20" /></span></div>
        <div class="ramp" id="ramp"></div>
      </div>
      <div id="nearest" class="list"></div>
    </section>

    <section id="mode-clu" class="mode" hidden>
      <label class="field"><span>Clusters <b id="kVal">8</b></span><input type="range" id="k" min="0" max="60" step="1" value="10" /></label>
      <div id="clutree" class="tree"></div>
    </section>

    <section id="mode-split" class="mode" hidden>
      <div class="crumbrow"><div id="crumbs" class="crumbs"></div><button id="reset" class="btn">Reset</button></div>
      <div id="children" class="tree"></div>
    </section>

    <footer>Data from <a href="https://genarchivist.net/showthread.php?tid=1449" target="_blank">Moriopoulos Collection 2025</a><br>Data viz by <a href="https://p.migdal.pl" target="_blank">Piotr Migdał</a> 2026</footer>
  </aside>
  <div id="map"></div>
  <div id="tooltip" hidden></div>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
