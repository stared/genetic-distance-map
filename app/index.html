<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>G25 map</title>
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>
<div id="app">
  <aside id="panel">
    <header>
      <nav id="modes" class="seg">
        <button data-mode="sim" class="active">Similarity</button>
        <button data-mode="clu">Clusters</button>
        <button data-mode="drill">Drill-down</button>
      </nav>
      <div class="toggles">
        <label><input type="checkbox" id="showM" checked /><span class="glyph m"></span>modern</label>
        <label><input type="checkbox" id="showA" checked /><span class="glyph a"></span>ancient</label>
        <label><input type="checkbox" id="showO" />outliers &amp; low-res</label>
      </div>
    </header>

    <section id="mode-sim" class="mode">
      <div class="search">
        <input id="search" type="search" placeholder="Search population" autocomplete="off" spellcheck="false" />
        <ul id="suggest" hidden></ul>
      </div>
      <div id="query" class="query"></div>
      <div class="legend">
        <div class="legend-head"><span>Distance</span><span class="legend-max">0 – <input type="number" id="dmax" min="2" max="80" step="1" value="20" /></span></div>
        <div class="ramp" id="ramp"></div>
      </div>
      <div id="nearest" class="list"></div>
    </section>

    <section id="mode-clu" class="mode" hidden>
      <div class="controls">
        <label class="field"><span>Populations</span>
          <select id="treeSet"><option value="m">modern</option><option value="a">ancient</option><option value="all">all</option></select>
        </label>
        <label class="field grow"><span>Clusters <b id="kVal">8</b></span><input type="range" id="k" min="0" max="60" step="1" value="10" /></label>
      </div>
      <div id="clutree" class="tree"></div>
    </section>

    <section id="mode-drill" class="mode" hidden>
      <div class="controls">
        <label class="field"><span>Populations</span>
          <select id="treeSet2"><option value="m">modern</option><option value="a">ancient</option><option value="all">all</option></select>
        </label>
        <label class="field"><span>Branches</span><select id="splitM"><option>2</option><option selected>3</option><option>4</option></select></label>
        <button id="up" class="btn">Up</button>
      </div>
      <div id="crumbs" class="crumbs"></div>
      <div id="children" class="tree"></div>
    </section>

    <footer><a href="https://genarchivist.net/showthread.php?tid=1449" target="_blank">Moriopoulos Collection 2025</a> · Global25 · Euclidean distance on scaled coordinates, ×100 · locations approximate</footer>
  </aside>
  <div id="map"></div>
  <div id="tooltip" hidden></div>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
